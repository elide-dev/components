name: Chromatic

"on":
  workflow_call:
    inputs:
      auto-accept:
        description: "Accept visual changes as the new baseline (used on main)."
        type: boolean
        default: false
      storybook-artifact:
        description: "Reuse a Storybook artifact from this run; build locally when empty."
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      auto-accept:
        description: "Accept visual changes as the new baseline."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  chromatic:
    name: "Visual test + publish"
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.RUNNER_DEFAULT || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - name: "Setup: Harden Runner"
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: "Setup: Checkout"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Chromatic needs full history to detect baselines across commits.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: "Setup: Workspace"
        uses: ./.github/actions/setup-workspace
        with:
          cache-scope: chromatic
          turbo-cache: ${{ inputs.storybook-artifact == '' }}
      - name: "Artifact: Download storybook-static"
        if: inputs.storybook-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.storybook-artifact }}
          path: apps/storybook/storybook-static
      - name: "Build: Storybook static site"
        if: inputs.storybook-artifact == ''
        # Root `build-storybook` runs `turbo run build --filter=@elide/storybook`,
        # which builds the tokens + ui deps first, then the Storybook site into
        # apps/storybook/storybook-static.
        run: bun run build-storybook
      - name: "Check: Storybook dependency stats"
        run: bun apps/storybook/verify-build.mjs
      - name: "Chromatic: Visual test + publish Storybook"
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          # Keep Git metadata aligned with the checkout and reused artifact.
          CHROMATIC_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHROMATIC_BRANCH: ${{ github.head_ref || github.ref_name }}
          CHROMATIC_SLUG: ${{ github.repository }}
          AUTO_ACCEPT: ${{ inputs.auto-accept }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "$AUTO_ACCEPT" = "true" ]; then
            ARGS+=(--auto-accept-changes)
          fi
          bun run chromatic "${ARGS[@]}"
