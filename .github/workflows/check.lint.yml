name: Lint

"on":
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: "ESLint"
    runs-on: ${{ vars.RUNNER_DEFAULT || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - name: "Setup: Harden Runner"
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: "Setup: Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Setup: Workspace"
        uses: ./.github/actions/setup-workspace
        with:
          cache-scope: lint
      - name: "Lint: ESLint via Turbo"
        run: bunx turbo run lint
