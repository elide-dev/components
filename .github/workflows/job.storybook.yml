name: Storybook

"on":
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storybook:
    name: "Static build"
    runs-on: ${{ vars.RUNNER_DEFAULT || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - name: "Setup: Harden Runner"
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: "Setup: Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Match the exact commit Chromatic will associate with this artifact.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: "Setup: Workspace"
        uses: ./.github/actions/setup-workspace
        with:
          cache-scope: storybook
      - name: "Build: Storybook static site"
        # CODECOV_TOKEN enables the @codecov/vite-plugin bundle-analysis upload
        # during the Vite build (no-op if the secret is absent).
        run: bunx turbo run build --filter=@elide/storybook
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: "Artifact: Upload storybook-static"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook-static
          path: apps/storybook/storybook-static
          retention-days: 7
          if-no-files-found: error
