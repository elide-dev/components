name: Storybook

"on":
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storybook:
    name: "Static build"
    runs-on: ${{ vars.RUNNER_DEFAULT || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - name: "Setup: Harden Runner"
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: "Setup: Checkout"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Match the exact commit Chromatic will associate with this artifact.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: "Setup: Workspace"
        uses: ./.github/actions/setup-workspace
        with:
          cache-scope: storybook
      - name: "Build: Storybook static site"
        # CODECOV_TOKEN enables the @codecov/vite-plugin bundle-analysis upload
        # during the Vite build (no-op if the secret is absent).
        run: bunx turbo run build --filter=@elide/storybook
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: "Artifact: Upload storybook-static"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storybook-static
          path: apps/storybook/storybook-static
          retention-days: 7
          if-no-files-found: error
