name: PR

"on":
  pull_request:

permissions:
  contents: read

concurrency:
  group: "pr-${{ github.event.number }}"
  cancel-in-progress: true

jobs:
  build:
    name: "Build"
    uses: ./.github/workflows/job.build.yml
    permissions:
      contents: read
    secrets: inherit

  lint:
    name: "Lint"
    uses: ./.github/workflows/check.lint.yml
    permissions:
      contents: read
    secrets: inherit

  test:
    name: "Test"
    uses: ./.github/workflows/check.test.yml
    permissions:
      contents: read
    secrets: inherit

  storybook:
    name: "Storybook"
    uses: ./.github/workflows/job.storybook.yml
    permissions:
      contents: read
    secrets: inherit

  chromatic:
    name: "Chromatic"
    needs: storybook
    # Fork PRs build and test normally, but have no Chromatic project secret.
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/check.chromatic.yml
    with:
      storybook-artifact: storybook-static
    permissions:
      contents: read
    secrets: inherit
